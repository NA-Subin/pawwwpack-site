<script>
(() => {
  const board = document.getElementById('board'), btn = document.getElementById('fit'), W = 502, H = 1328
  let fit = true
  function apply() {
    const avail = document.querySelector('.stage').clientWidth - 48
    const s = fit ? Math.min(1, avail / W) : 1
    board.style.transform = s < 1 ? 'scale(' + s + ')' : ''
    board.parentElement.style.height = s < 1 ? (H * s + 48) + 'px' : ''
    btn.textContent = fit ? 'ขนาดจริง' : 'พอดีจอ'
  }
  btn.onclick = () => { fit = !fit; apply() }
  addEventListener('resize', apply)
  apply()
})()
</script>
